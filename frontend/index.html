<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Guard - Long Form AI Video</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; }
      input, textarea, button { width: 100%; margin-top: 0.5rem; padding: 0.6rem; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div style="display:flex;align-items:center;gap:0.8rem;"><img src="assets/guard-logo.svg" alt="Guard logo" style="width:56px;height:56px" /><h1 style="margin:0;">Guard AI Video Generator</h1></div>
    <div class="card">
      <h3>Create Project</h3>
      <input id="projectName" placeholder="Project name" />
      <button onclick="createProject()">Create Project</button>
      <p id="projectOut"></p>
    </div>
    <div class="card">
      <h3>Create Job (up to 1020 seconds / 17 minutes)</h3>
      <input id="projectId" placeholder="Project ID" />
      <textarea id="prompt" placeholder="Describe your animation"></textarea>
      <input id="duration" type="number" min="5" max="1020" value="120" />
      <button onclick="createJob()">Queue Job</button>
      <p id="jobOut"></p>
    </div>
    <script>
      const api = 'http://localhost:8000';
      async function createProject() {
        const name = document.getElementById('projectName').value;
        const res = await fetch(`${api}/projects`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name})
        });
        document.getElementById('projectOut').textContent = JSON.stringify(await res.json(), null, 2);
      }
      async function createJob() {
        const payload = {
          project_id: document.getElementById('projectId').value,
          prompt: document.getElementById('prompt').value,
          duration_seconds: Number(document.getElementById('duration').value),
          mode: 'text_to_video'
        };
        const res = await fetch(`${api}/jobs`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        document.getElementById('jobOut').textContent = JSON.stringify(await res.json(), null, 2);
      }
    </script>
  </body>
</html>
